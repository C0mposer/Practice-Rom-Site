<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Spyro 1 Practice Rom website with downloads, documentation, and a ROM patcher."
    />
    <title>Spyro 1 Practice Rom</title>
    <script>
      (function () {
        if (location.hostname === 'c0mposer.github.io' && /\/Practice-Rom-Site\/?/i.test(location.pathname)) {
          location.replace('https://www.spyropracticerom.com/' + location.search + location.hash);
          return;
        }

        var path = location.pathname.replace(/\/{2,}/g, '/');
        if (path.length > 1) path = path.replace(/\/+$/, '');
        if (!path) path = '/';
        if (path !== location.pathname) {
          location.replace(location.origin + path + location.search + location.hash);
        }
      })();
    </script>
    <link rel="icon" href="%BASE_URL%assets/comp-kara-logo.png" />
    <link rel="stylesheet" href="%BASE_URL%vendor/rom-patcher-js/style.css" />
    <script defer src="%BASE_URL%vendor/rom-patcher-js/RomPatcher.webapp.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
